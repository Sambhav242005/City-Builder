name: Test and deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citybuilder-pi-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy tested commit on Pi
    needs: test
    runs-on:
      - self-hosted
      - citybuilder-pi
    if: github.ref == 'refs/heads/main'

    env:
      DEPLOY_DIR: /home/sambhav/CityBuilder
      FRONTEND_API_BASE: http://192.168.1.5:8010

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Sync app files
        shell: bash
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          runner_group="$(id -gn)"
          sudo install -d -o "$runner_user" -g "$runner_group" "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'backend/.venv/' \
            --exclude 'frontend/node_modules/' \
            "$GITHUB_WORKSPACE"/ "$DEPLOY_DIR"/

      - name: Install system packages
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/system-packages.txt ]; then
            exit 0
          fi

          mapfile -t packages < <(
            sed -e 's/#.*$//' -e '/^[[:space:]]*$/d' deploy/system-packages.txt
          )

          if [ "${#packages[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "${packages[@]}"
          fi

      - name: Install app dependencies and build
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          python3 -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

          cd frontend
          npm ci
          VITE_API_BASE="$FRONTEND_API_BASE" npm run build

      - name: Install and restart services
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          sudo install -m 0644 deploy/systemd/citybuilder-backend.service /etc/systemd/system/citybuilder-backend.service
          sudo install -m 0644 deploy/systemd/citybuilder-frontend.service /etc/systemd/system/citybuilder-frontend.service
          sudo systemctl daemon-reload
          sudo systemctl enable citybuilder-backend.service citybuilder-frontend.service
          sudo systemctl restart citybuilder-backend.service citybuilder-frontend.service

      - name: Verify deployed services
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS http://127.0.0.1:8010/state >/dev/null
          curl -fsS http://127.0.0.1:5173 >/dev/null
          sudo systemctl --no-pager --full status citybuilder-backend.service citybuilder-frontend.service
