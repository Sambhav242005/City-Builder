name: Test and deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citybuilder-pi-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy tested commit on Pi
    needs: test
    runs-on:
      - self-hosted
      - citybuilder-pi
    if: github.ref == 'refs/heads/main'

    env:
      DEPLOY_DIR: /home/sambhav/CityBuilder
      REPO_URL: https://github.com/Sambhav242005/City-Builder.git

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Sync tested commit
        shell: bash
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          runner_group="$(id -gn)"
          deploy_parent="$(dirname "$DEPLOY_DIR")"
          sudo install -d -o "$runner_user" -g "$runner_group" "$deploy_parent"

          if [ -e "$DEPLOY_DIR" ] && [ ! -d "$DEPLOY_DIR/.git" ]; then
            backup_dir="${DEPLOY_DIR}.pre-docker.$(date +%Y%m%d%H%M%S)"
            mv "$DEPLOY_DIR" "$backup_dir"
          fi

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone "$REPO_URL" "$DEPLOY_DIR"
          fi

          git -C "$DEPLOY_DIR" fetch --force origin main
          git -C "$DEPLOY_DIR" checkout -B main "$GITHUB_SHA"
          git -C "$DEPLOY_DIR" reset --hard "$GITHUB_SHA"
          git -C "$DEPLOY_DIR" clean -fdx

      - name: Install system packages
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/system-packages.txt ]; then
            exit 0
          fi

          mapfile -t packages < <(
            sed -e 's/#.*$//' -e '/^[[:space:]]*$/d' deploy/system-packages.txt
          )

          if [ "${#packages[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "${packages[@]}"
          fi

      - name: Retire legacy host services
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          sudo systemctl disable --now citybuilder-backend.service citybuilder-frontend.service 2>/dev/null || true

      - name: Build and restart Docker stack
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          sudo docker compose -f deploy/docker-compose.yml --project-name citybuilder up -d --build --remove-orphans
          sudo docker compose -f deploy/docker-compose.yml --project-name citybuilder ps

      - name: Verify deployed Docker stack
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null \
              && curl -fsS http://127.0.0.1:5173/api/state >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:5173/ >/dev/null
          curl -fsS http://127.0.0.1:5173/api/state >/dev/null
          sudo docker compose -f deploy/docker-compose.yml --project-name citybuilder ps
