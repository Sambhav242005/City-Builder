<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagegen Showcase City</title>
<style>
  :root { --tile: 72px; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: start center;
    background: #07111b;
    color: #f5f7fb;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
  }
  .wrap { padding: 18px; }
  h1 { margin: 0 0 12px; font-size: 20px; letter-spacing: 0; }
  .map {
    position: relative;
    width: 1440px;
    height: 1152px;
    background: #102331;
    overflow: hidden;
    isolation: isolate;
  }
  .map::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.14) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.14) 1px, transparent 1px);
    background-size: var(--tile) var(--tile);
    z-index: 10;
  }
  .tile {
    position: absolute;
    left: calc(var(--x) * var(--tile));
    top: calc(var(--y) * var(--tile));
    width: var(--tile);
    height: var(--tile);
    transform: rotate(var(--r));
    transform-origin: center;
    user-select: none;
  }
  .terrain, .ground, .roads { z-index: 1; }
  .rail { z-index: 2; }
  .overlays { z-index: 3; }
  .sprites { z-index: 4; }
</style>
