services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      CITYBUILDER_CORS_ORIGINS: "http://citybuilder.sambhav-surana.online,https://citybuilder.sambhav-surana.online,http://192.168.1.5:5173"
    expose:
      - "8085"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/state', timeout=5).read()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
